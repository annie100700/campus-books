spring:
  application:
    name: campus-books
  profiles:
    active: dev
  jpa:
    database: MYSQL
    properties:
      hibernate:
        type:
          json_format_mapper: com.annie.campus_books.utilities.JsonFormatterUtil
        format-sql: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
jwt:
  secret-key: ${SECRET_KEY}
  access-valid-millis: 600000
  refresh-valid-millis: 3600000
  password-reset-valid-millis: 900000