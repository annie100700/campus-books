spring:
  application:
    name: campus-books
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    username: Annie
    password: ${DB_PASSWORD}
    url: jdbc:mysql://127.0.0.1:3306/campus_books
  jpa:
    database: MYSQL
    properties:
      hibernate:
        type:
          json_format_mapper: com.annie.campus_books.utilities.JsonFormatterUtil
        format-sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MY_EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
jwt:
  secret-key: ${SECRET_KEY}
  access-valid-millis: 600000
  refresh-valid-millis: 3600000
  password-reset-valid-millis: 900000